apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bird-observation
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/syedayub-ss/bird-observation-gitops.git
    targetRevision: main
    path: charts/bird-observation
    helm:
      releaseName: bird-observation
      valueFiles:
        - ../../environments/dev/values.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: bird-observation

  syncPolicy:
    automated:
      prune: false
      selfHeal: true
